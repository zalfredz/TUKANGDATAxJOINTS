<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>TUKANGDATA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
/* Layout: dark cinema console. Header with tabs; Simulasi = input panel (4/12) + decision banner, 10-day chart, rule strip (8/12). */
:root{
  --bg:#0B0C10; --panel:#13151C; --card:#1A1D27; --border:#272B38; --fg:#F3F4F6; --muted:#9CA3AF; --dim:#6B7280;
  --red:#E50914; --gold:#D4AF37; --goldl:#F3D067; --known:#475569; --fc:#6366F1;
  --tambah:#34D399; --pertahankan:#38BDF8; --kurangi:#F59E0B; --turunkan:#EF4444;
  --sans:"Plus Jakarta Sans",ui-sans-serif,system-ui,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{min-height:100vh;background-color:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45;
  background-image:radial-gradient(circle at 10% 0%,rgba(212,175,55,.07),transparent 40%),radial-gradient(circle at 90% 0%,rgba(229,9,20,.07),transparent 40%)}
.mono{font-family:var(--mono)}
.top{border-bottom:1px solid var(--border);background:rgba(11,12,16,.92)}
.top::before{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--red),var(--gold))}
.in,.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{min-height:62px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand i{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--red),#7F1D1D);font-style:normal;font-size:12px;color:#fff}
.brand b{color:var(--red)}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:4px}
.tabs button{font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:none;border:1px solid transparent;border-radius:8px;padding:6px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--goldl);border-color:rgba(212,175,55,.4)}
.engine{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:6px 12px}
.engine::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tambah)}
.engine b{color:var(--fg)} .engine em{font-style:normal;color:var(--goldl)}
.wrap{padding-block:20px 36px}
.sim{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:20px;align-items:stretch}
.sim>aside{display:flex;flex-direction:column}
@media (max-width:1000px){.sim{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
form{display:flex;flex-direction:column;justify-content:space-between;gap:14px;flex:1}
.f{display:grid;gap:6px;min-width:0}
label,.cap{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input,select{font:inherit;font-size:14px;color:var(--fg);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;width:100%;min-width:0}
optgroup{background:#2B303D;color:#D1D5DB;font-weight:700;font-style:normal}
option{background:var(--card);color:var(--fg);font-weight:500}
input[readonly]{color:var(--dim);cursor:default}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.two{display:flex;gap:10px;align-items:flex-end}.two>.f{flex:1 1 0}.two>#tbox{flex:0 0 38%}
.box{background:rgba(26,29,39,.7);border:1px solid var(--border);border-radius:12px;padding:12px;display:grid;gap:8px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.three span{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;margin-bottom:4px}
.three input{background:var(--bg);text-align:center;font-family:var(--mono);font-weight:700;font-size:15px}
.reads{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11px;color:var(--muted)}
.reads div{background:rgba(11,12,16,.6);border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;gap:6px}
.reads b{font-family:var(--mono);color:var(--goldl)}
.go{font:inherit;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#fff;border:0;border-radius:12px;padding:13px;cursor:pointer;background:linear-gradient(90deg,var(--red),#B91C1C);box-shadow:0 8px 20px -8px rgba(229,9,20,.5)}
.err{font-size:12px;color:var(--turunkan)}
.err:empty{display:none}
.stage{display:grid;gap:20px;min-width:0}
.banner{border-width:1px;border-style:solid;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.badge{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;border-radius:6px;padding:3px 10px;border:1px solid}
.desc{margin:6px 0 0;max-width:46ch;font-size:13px;color:var(--muted)}
.word{margin:0;text-transform:uppercase;font-size:clamp(26px,3.2vw,34px);font-weight:800;letter-spacing:-.01em;line-height:1.05}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;min-width:120px;display:grid;gap:2px}
.kpi span{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.kpi b{font-family:var(--mono);font-size:20px;font-weight:800}
.kpi small{font-size:10.5px;color:var(--muted)}
.chead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--border)}
.chead h3{margin:0;font-size:17px;font-weight:700}
.chead h3 small{font-size:12px;font-weight:500;color:var(--muted)}
.chart{overflow-x:auto}
.cin{min-width:640px}
.zones{display:grid;grid-template-columns:3fr 7fr;gap:10px;margin-bottom:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.zones div{border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;gap:6px}
.zones .k{background:var(--card);border:1px solid var(--border);color:var(--muted)} .zones .k b{color:var(--goldl)}
.zones .p{background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.3);color:#C7D2FE}
.days{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px;align-items:start}
.day{display:grid;justify-items:center;gap:6px;min-width:0}
.day.first{border-left:2px dashed rgba(99,102,241,.4);padding-left:8px}
.num{text-align:center;line-height:1.15}
.num b{display:block;font-family:var(--mono);font-size:14px;font-weight:800}
.num span{font-family:var(--mono);font-size:10px;color:#C7D2FE}
.day.known .num span{color:var(--muted)}
.track{position:relative;width:100%;height:190px;background:rgba(11,12,16,.8);border:1px solid rgba(39,43,56,.7);border-radius:10px;padding:3px;display:flex;align-items:flex-end;overflow:hidden}
.day.we .track{background:rgba(212,175,55,.06)}
.bar{width:100%;border-radius:7px;min-height:3px;background:linear-gradient(0deg,#312E81,var(--fc));border-top:1px solid rgba(165,180,252,.6)}
.day.known .bar{background:linear-gradient(0deg,#1E293B,var(--known));border-top:2px solid var(--gold)}
.day.zero .bar{background:rgba(127,29,29,.5);border:1px solid var(--red)}
@media (prefers-reduced-motion:no-preference){.bar{animation:grow .5s cubic-bezier(.16,1,.3,1);transform-origin:bottom}@keyframes grow{from{transform:scaleY(.05)}}}
.ghost{position:absolute;bottom:3px;left:3px;right:3px;border:2px dashed var(--tambah);border-bottom:0;border-radius:7px 7px 0 0}
.capl{position:absolute;left:0;right:0;border-top:2px dashed rgba(243,208,103,.75);z-index:1}
.track.stop{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.5)}
.act{position:absolute;left:50%;width:12px;height:12px;margin:0 0 -6px -6px;border-radius:50%;background:#fff;border:2px solid var(--bg);box-shadow:0 0 0 2px var(--gold)}
.lab{display:grid;justify-items:center;gap:2px;width:100%;min-width:0;text-align:center}
.lab b{font-family:var(--mono);font-size:10px;color:var(--muted)}
.day.we .lab b{color:var(--goldl)}
.lab span{font-size:11px;color:#D1D5DB}
.hol{min-height:22px;display:flex;align-items:flex-start;justify-content:center;width:100%}
.hol em{font-style:normal;font-size:9.5px;font-weight:600;line-height:1.2;color:var(--goldl);background:rgba(212,175,55,.15);border:1px solid rgba(212,175,55,.4);border-radius:4px;padding:2px 4px;max-width:100%}
.hol em.full{color:var(--tambah);background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.4)}
.occ{font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:4px;padding:1px 5px}
.occ.full{color:var(--tambah);border-color:rgba(52,211,153,.4)}
.legend{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.legend>span{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--gold);margin-right:5px;vertical-align:-1px}
.dash{display:inline-block;width:16px;border-top:2px dashed var(--goldl);margin-right:5px;vertical-align:3px}
.rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.rules{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.rule{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;opacity:.55}
.rule.on{opacity:1;border:2px solid var(--gold);background:rgba(212,175,55,.12)}
.rule p{margin:0}.rule .n{font-family:var(--mono);font-size:10px;font-weight:700}
.rule .t{font-weight:700;margin-top:2px}.rule .c{font-size:11px;color:var(--muted);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
th{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center;padding:12px 10px;border-bottom:1px solid var(--border);background:rgba(26,29,39,.6)}
td{padding:14px 10px;border-bottom:1px solid var(--border);text-align:center;font-family:var(--mono)}
th:first-child,td:first-child{text-align:left;font-family:var(--sans)} th:last-child,td:last-child{text-align:right}
td small{display:block;font-size:10px;color:var(--muted)}
tbody tr{cursor:pointer} tbody tr:hover{background:rgba(26,29,39,.8)}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:11.5px;font-weight:700;border:1px solid;border-radius:8px;padding:4px 10px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tbl{overflow-x:auto}
.mhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.msel{display:flex;flex-wrap:wrap;gap:10px}.mhead select{width:auto;min-width:180px;font-weight:700}
.counts{display:flex;flex-wrap:wrap;gap:8px}
.counts button{font:inherit;font-size:12px;font-weight:700;border:1px solid;border-radius:8px;padding:5px 10px;cursor:pointer;opacity:.55}
.counts button[aria-pressed="true"]{opacity:1}
tr.none td{text-align:left!important;font-family:var(--sans);font-size:12px;color:var(--dim);cursor:default}
tr.grp td{font-family:var(--sans);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(26,29,39,.6);padding:8px 10px;cursor:default;text-align:left!important}
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:26px}
.spark i{display:block;width:7px;border-radius:2px 2px 0 0;background:var(--fc)}
.sec-title{margin:6px 0 2px;font-size:20px;font-weight:800}
</style>
</head>
<body>

<header class="top"><div class="in">
  <div class="brand"><i>TD</i><span>TUKANG<b>DATA</b></span></div>
  <nav class="tabs" role="tablist">
    <button role="tab" id="t-sim" aria-selected="true" data-v="sim">Simulasi</button>
    <button role="tab" id="t-man" aria-selected="false" data-v="man">Manajer</button>
  </nav>
</div></header>

<main class="wrap">
  <section id="v-sim" class="sim">
    <aside class="panel">
      <form id="f" autocomplete="off">
        <div class="f"><label for="film">Film</label><select id="film"></select><input id="filmNew" placeholder="Ketik judul film baru" hidden></div>
        <div class="two">
          <div class="f"><label for="kota">Kota</label><select id="kota"></select></div>
          <div class="f" id="klbox"><label for="city" id="kllab">ID klaster</label><select id="city"></select></div>
          <div class="f" id="tbox" hidden><label for="teater">Teater</label><input id="teater" type="number" min="1" max="30" step="1" placeholder="2" required></div>
        </div>
        <div class="f"><label for="d1">Tanggal hari pertama</label><input id="d1" type="date" min="2025-03-01" max="2026-04-21" required></div>
        <div class="box">
          <span class="cap">Tiket terjual D1–D3</span>
          <div class="three">
            <div><span id="l1">D1</span><input id="y1" type="number" min="0" max="100000" step="1" aria-label="Tiket hari 1" required></div>
            <div><span id="l2">D2</span><input id="y2" type="number" min="0" max="100000" step="1" aria-label="Tiket hari 2" required></div>
            <div><span id="l3">D3</span><input id="y3" type="number" min="0" max="100000" step="1" aria-label="Tiket hari 3" required></div>
          </div>
        </div>
        <button class="go" type="submit">Prediksi</button>
        <div class="err" id="err" role="alert"></div>
      </form>
    </aside>

    <div class="stage">
      <div class="panel banner" id="banner" aria-live="polite">
        <div><h1 class="word" id="word"></h1><p class="desc" id="desc"></p></div>
        <div class="kpis">
          <div class="kpi"><span>Prediksi total penjualan 7 hari</span><b id="k2"></b></div>
          <div class="kpi" id="k3box"><span>MASE</span><b id="k3" style="color:var(--tambah)"></b><small id="k3s"></small></div>
        </div>
      </div>

      <div class="panel">
        <div class="chead"><h3 id="ctitle"></h3></div>
        <div class="chart"><div class="cin">
          <div class="days" id="days"></div>
        </div></div>
        <div class="legend"><span id="legend"></span></div>
      </div>


    </div>
  </section>


  <section id="v-man" hidden>
    <div class="panel" style="display:grid;gap:16px">
      <div class="mhead"><div class="msel"><select id="mcity" aria-label="Kota"></select><select id="mkl" aria-label="Klaster"></select></div><div class="counts" id="mcount"></div></div>
      <div class="tbl"><table><thead><tr><th>Film</th><th>Rilis</th><th>Rata-rata D1–D3</th><th>Prediksi 7 hari</th><th>Total 7 hari</th><th>Keputusan</th></tr></thead><tbody id="mrows"></tbody></table></div>
    </div>
  </section>

</main>

const DOW = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const MON = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function addDays(iso, n){ const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }
function dow(iso){ return new Date(iso + 'T00:00:00Z').getUTCDay(); }
function holiday(iso){ const c = DATA.cal[iso]; if(!c || !c[1]) return ''; return c[1].replace(/^CB /,'Cuti bersama ').replace(/ \(revision.*\)/,''); }
// day weight relative to the week (fig07): weekend 1,33 · weekday holiday 1,26 · Friday 0,98 · Mon–Thu 0,74 (0,91 in school holidays)
function weight(iso){ const c = DATA.cal[iso]; if(c) return c[0]; const w = dow(iso); return (w===0||w===6) ? 1.33 : w===5 ? 0.98 : 0.74; }
function isWeekend(iso){ const w = dow(iso); return w===0 || w===6; }

function similarCases(y, d1, excludeFam, city){
  const wd = [0,1,2].map(i => weight(addDays(d1,i)));
  const a = y.map((v,i) => (v+1)/wd[i]);
  const f = [Math.log(a[1]/a[0]), Math.log(a[2]/a[0]), 0.25*Math.log1p((y[0]+y[1]+y[2])/3)];
  const K = 100, best = [];
  for(const r of DATA.lib){
    if(r[10] === excludeFam) continue;
    const dist = (r[0]-f[0])**2 + (r[1]-f[1])**2 + (r[2]-f[2])**2;
    if(best.length < K){ best.push([dist,r]); if(best.length===K) best.sort((p,q)=>q[0]-p[0]); }
    else if(dist < best[0][0]){ best[0] = [dist,r]; best.sort((p,q)=>q[0]-p[0]); }
  }
  const w13 = (wd[0]+wd[1]+wd[2])/3, scale = Math.max(1,(y[0]+y[1]+y[2])/3);
  const R = [0,1,2,3,4,5,6].map(i => {
    const v = best.map(b => b[1][3+i]).sort((p,q)=>p-q);
    const med = K%2 ? v[(K-1)/2] : (v[K/2-1]+v[K/2])/2;
    return Math.max(0, med * weight(addDays(d1,3+i)) / w13);
  });
  return jointsLayers(R, d1, city).map(r => r * scale);
}

// Post-model calendar layers from the JOINTS notebook (nb_80_modeling, Lampiran L06), on R = tickets / mean(D1–D3).
function jointsLayers(R, d1, city){
  const C = (city||'').toUpperCase();
  return R.map((r,i) => {
    const k = i+4, date = addDays(d1, 3+i);
    if(date === '2025-12-31') r *= 0.577;                                  // b: malam tahun baru
    else if(DATA.calm[d1+'|'+k]) r *= DATA.calm[d1+'|'+k];                 // b: H-3..H-1 Lebaran, awal Ramadan
    if(d1 === '2026-03-18'){                                               // c: kohort Lebaran = prior(hari, tipe kota) × peringkat^0,2
      const prior = (DATA.leb[C] || DATA.leb[DATA.ctype[C]] || DATA.leb.destination_java)[i];
      const rank = Math.min(10, Math.max(0.1, Math.max(r, 0.05) / (0.8*prior)));
      r = prior * rank ** 0.2;
    }
    if(C === 'DENPASAR' && date === '2026-03-19') r = 0;                   // d: Nyepi
    return Math.max(0, r);                                                 // a: R >= 0
  });
}

// Rule order from the kit's Yogyakarta card. pred = tickets for days 4..10.
function decide(pred, y, d1){
  const avg = Math.max(1,(y[0]+y[1]+y[2])/3), R = pred.map(t => t/avg), date = i => addDays(d1,3+i);
  const zero = t => t < 0.5;
  if(zero(pred[6])){ let j = 6; while(j>0 && zero(pred[j-1])) j--; return {code:'TURUNKAN', day:j, R}; }
  for(let i=0;i<7;i++) if(isWeekend(date(i)) && R[i] >= 1.0) return {code:'TAMBAH', kind:'weekend', day:i, R};
  for(let i=1;i<7;i++) if(weight(date(i))===1.26 && R[i] >= 1.2*R[i-1]) return {code:'TAMBAH', kind:'libur', day:i, R};
  const tail = (R[4]+R[5]+R[6])/3;
  if(tail >= 0.5) return {code:'PERTAHANKAN', tail, R};
  let j = R.findIndex(r => r < 0.5); if(j < 0) j = 4;
  return {code:'KURANGI', day:j, tail, R};
}

// A TabICLv2 forecast moved to another release date: keep its decay, swap the calendar of the old dates for the new ones.
function shiftDate(tab, y, fromD1, toD1, city){
  const s = Math.max(1,(y[0]+y[1]+y[2])/3), w13 = d => [0,1,2].reduce((a,i)=>a+weight(addDays(d,i)),0)/3;
  const R = tab.map((t,i) => t/s / (weight(addDays(fromD1,3+i))/w13(fromD1)) * weight(addDays(toD1,3+i))/w13(toD1));
  return jointsLayers(R, toD1, city).map(r => r*s);
}
// 1 teater ≈ 5 pertunjukan × 149 kursi per hari (median data latih; kit 06_FAKTA_ANGKA bagian B)
const SEATS_PER_TEATER = 5*149;

// Capacity-aware decision (dashboard rule). cap = seats per day of the current schedule. days = when the action applies.
function decideCap(pred, y, cap){
  const avg = Math.max(1,(y[0]+y[1]+y[2])/3), t = pred, span = j => [...Array(7-j)].map((_,k)=>j+k);
  if(t[6] < 0.5){ let j = 6; while(j>0 && t[j-1] < 0.5) j--; return {code:'TURUNKAN', days:span(j), start:j}; }
  const over = t.map((x,i)=>x>cap?i:-1).filter(i=>i>=0);
  if(over.length) return {code:'TAMBAH', days:over, start:over[0]};
  if((t[4]+t[5]+t[6])/3 < 0.5*avg){ let j = t.findIndex(x=>x<0.5*avg); if(j<0) j = 4; return {code:'KURANGI', days:span(j), start:j}; }
  return {code:'PERTAHANKAN', days:[], start:-1};
}
// seats per day: current schedule (shows x 149), but never below what D1-D3 already sold (best day assumed at most 85% full)
const capOf = c => Math.max(c.sh ? (c.sh[0]+c.sh[1]+c.sh[2])/3*149 : c.teater*SEATS_PER_TEATER, Math.max(...c.y)/0.85);
/*END*/
const $ = id => document.getElementById(id);
const fmtN = n => Math.round(n).toLocaleString('id-ID');
const fmtX = x => x.toFixed(2).replace('.', ',') + '×';
const fmtD = iso => { const d = new Date(iso+'T00:00:00Z'); return `${DOW[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; };
const famOf = name => DATA.films.findIndex(f => f.toLowerCase() === name.trim().toLowerCase().replace(/ \((imax 2d|imax 3d|3d)\)$/,''));
// Short holiday names for display (full names come from the SKB calendar)
const HOL = [[/Muharam|Tahun Baru Islam/,'Tahun Baru Islam'],[/Idulfitri/,'Idulfitri'],[/Idul ?Adha|Iduladha/,'Iduladha'],[/Waisak/,'Waisak'],
  [/Kelahiran Yesus|Natal/,'Natal'],[/Imlek/,'Imlek'],[/Tahun Baru 20/,'Tahun Baru'],[/Nyepi/,'Nyepi'],[/Wafat Yesus/,'Jumat Agung'],
  [/Paskah/,'Paskah'],[/Kenaikan Yesus/,'Kenaikan Yesus'],[/Isra Mikraj/,'Isra Mikraj'],[/Maulid/,'Maulid Nabi'],[/Buruh/,'Hari Buruh'],
  [/Kemerdekaan|HUT RI/,'HUT RI'],[/Pancasila/,'Hari Pancasila']];
function holShort(iso){
  const h = holiday(iso); if(!h) return '';
  const base = (HOL.find(([re]) => re.test(h)) || [0, h])[1];
  return /^Cuti bersama/.test(h) ? `Cuti ${base}` : base;
}
const WORD = {TAMBAH:'Tingkatkan', PERTAHANKAN:'Pertahankan', KURANGI:'Kurangi', TURUNKAN:'Hentikan'};
const DESC = {TAMBAH:'Permintaan naik. Tambah jam tayang.', PERTAHANKAN:'Permintaan stabil. Jadwal tetap.',
  KURANGI:'Permintaan turun. Kurangi pertunjukan.', TURUNKAN:'Permintaan habis. Hentikan penayangan.'};
const wordOf = v => WORD[v.code];
const ACTION = {TAMBAH:'Tambah jadwal', KURANGI:'Kurangi', TURUNKAN:'Hentikan', PERTAHANKAN:''};
const ORDER = ['TAMBAH','PERTAHANKAN','KURANGI','TURUNKAN'];
const RULE = v => v.code==='TURUNKAN' ? 1 : v.code==='TAMBAH' ? (v.kind==='libur' ? 3 : 2) : v.code==='PERTAHANKAN' ? 4 : 5;
const col = c => `var(--${c.toLowerCase()})`;
const MIN_D1 = '2025-03-01', MAX_D1 = '2026-04-21';

function badgeText(v, d1, pred, avg){
  const day = i => fmtD(addDays(d1, 3+i));
  if(v.kind==='penuh') return `Kursi penuh · ${day(v.day)}`;
  if(v.code==='TURUNKAN') return `Aturan 1 · 0 tiket mulai ${day(v.day)}`;
  if(v.kind==='libur') return `Aturan 3 · ${holShort(addDays(d1,3+v.day)) || 'Libur'} ${fmtX(pred[v.day]/Math.max(pred[v.day-1],1e-9))} hari sebelumnya`;
  if(v.code==='TAMBAH') return `Aturan 2 · ${day(v.day)} ${fmtX(pred[v.day]/avg)}`;
  if(v.code==='PERTAHANKAN') return `Aturan 4 · D8–D10 ${fmtX(v.tail)}`;
  return `Aturan 5 · turun di bawah 0,5× mulai ${day(v.day)}`;
}

function read(){
  const fv = $('film').value, isNew = fv === '__new', sc = SCEN[fv];
  return {isNew, film:isNew ? $('filmNew').value.trim() : sc ? sc.film : fv, kota:$('kota').value, city:isNew ? $('kota').value : $('city').value,
    n:Math.max(1,Number($('teater').value)||1), d1:$('d1').value, y:['y1','y2','y3'].map(id=>Number($(id).value))};
}

function labels(q){
  ['l1','l2','l3'].forEach((id,i)=>$(id).textContent = q.d1 ? fmtD(addDays(q.d1,i)) : `Hari ${i+1}`);
}

let timer, lastFilm = null;
function run(){
  const q = read(); labels(q);
  const err = !q.film ? 'Ketik judul film.'
    : !q.d1 || q.d1 < MIN_D1 || q.d1 > MAX_D1 ? 'Pilih tanggal 1 Mar 2025 – 21 Apr 2026.'
    : q.y.some(v=>!Number.isInteger(v)||v<0||v>100000) ? 'Tiket D1–D3: bilangan bulat 0–100.000.'
    : q.y.every(v=>v===0) ? 'Tiket D1–D3 tidak boleh semuanya 0.'
    : !(Number($('teater').value)>=1 && Number($('teater').value)<=30) ? 'Teater 1–30.'
    : Math.max(...q.y) > q.n*SEATS_PER_TEATER ? `${fmtN(Math.max(...q.y))} tiket/hari tidak muat di ${q.n} teater. Tambah teater.` : '';
  $('err').textContent = err;
  if(err) return;
  const P = !q.isNew && DATA.demo.find(p=>p.film===q.film), C = P && entry(P, q.kota, q.city);
  let pred, act = null, mode;
  if(C && C.y.every((v,i)=>v===q.y[i])){
    if(q.d1===P.d1){ pred = C.tab; act = C.act; mode = P.uji ? 'TabICLv2 · data uji' : 'TabICLv2 · validasi'; }
    else { pred = shiftDate(C.tab, q.y, P.d1, q.d1, C.city); mode = 'TabICLv2 · skenario tanggal (tanpa data aktual)'; }
  } else { pred = similarCases(q.y, q.d1, famOf(q.film), q.kota); mode = 'Estimasi cepat'; }

  // capacity = seats of the schedule running in D1-D3 (listed films) or of the theaters typed in (new film)
  const avg = Math.max(1,(q.y[0]+q.y[1]+q.y[2])/3), cap = C && !q.isNew ? capOf(C) : capOf({teater:q.n, y:q.y});
  const v = decideCap(pred, q.y, cap), c = col(v.code), sold = pred;

  // banner
  $('banner').style.borderColor = `color-mix(in srgb, ${c} 45%, transparent)`;
  $('banner').style.boxShadow = `0 0 26px -6px color-mix(in srgb, ${c} 30%, transparent)`;
  $('word').textContent = wordOf(v); $('desc').textContent = DESC[v.code]; $('word').style.color = c;
  const total = sold.reduce((a,b)=>a+b,0);
  $('k2').textContent = fmtN(total);
  // MASE only where actual sales exist (validation films at their real date), next to LightGBM on the same rows
  $('k3box').hidden = !act;
  if(act){
    const err = p => act.reduce((s,a,i)=>s+Math.abs(p[i]-a),0)/7/avg;
    $('k3').textContent = err(pred).toFixed(2).replace('.',',');
    $('k3s').textContent = C.lgb ? `LightGBM ${err(C.lgb).toFixed(2).replace('.',',')}` : '';
  }

  // chart
  $('ctitle').textContent = q.film;
  const top = Math.max(...q.y, ...pred, ...(act||[]), cap, 1), max = top * 1.05;
  const line = `<span class="capl" style="bottom:${cap/max*100}%"></span>`;
  $('days').innerHTML = [...q.y, ...pred].map((t,j)=>{
    const known = j < 3, i = j-3, iso = addDays(q.d1, j), d = new Date(iso+'T00:00:00Z'), off = isWeekend(iso)||holiday(iso);
    const hit = !known && v.days.includes(i), s = t, zero = !known && t < 0.5, h = holShort(iso), ghost = '';
    const a = act && !known ? `<span class="act" style="bottom:${act[i]/max*100}%" title="Aktual ${fmtN(act[i])}"></span>` : '';
    const fill = hit ? `background:${c};border-top-color:${c}` : '';  // days the action applies to
    return `<div class="day${known?' known':''}${hit?' hit':''}${off?' we':''}${zero?' zero':''}${j===3?' first':''}">`
      + `<div class="num"><b style="${zero?'color:var(--turunkan)':''}">${fmtN(s)}</b></div>`
      + `<div class="track${hit && zero ? ' stop' : ''}">${line}${ghost}<div class="bar" style="height:${Math.max(2, s/max*100)}%;${fill}"></div>${a}</div>`
      + `<div class="lab"><b>${DOW[d.getUTCDay()]}</b><span>${d.getUTCDate()} ${MON[d.getUTCMonth()]}</span></div>`
      + `<div class="hol">${!known && t>cap?'<em class="full">penuh</em>':h?`<em>${h}</em>`:''}</div></div>`;
  }).join('');
  $('legend').innerHTML = `<span><span class="sw" style="background:var(--known)"></span>Terjual</span>`
    + `<span><span class="sw" style="background:var(--fc)"></span>Prediksi</span>`
    + (act ? '<span><span class="dot"></span>Aktual</span>' : '')
    + '<span><span class="dash"></span>Kapasitas jadwal sekarang</span>'
    + (v.days.length ? `<span><span class="sw" style="background:${c}"></span>${ACTION[v.code]} ${v.code==='TAMBAH' ? 'di hari yang penuh' : 'mulai ' + fmtD(addDays(q.d1, 3+v.start))}</span>` : '');
  lastFilm = q.film;
}

// "Semua" = every listed cluster of this film in the city, summed day by day (tickets, forecast, actual, LightGBM)
function agg(p, kota){
  const cs = Object.values(p.cities).filter(c => c.city===kota); if(!cs.length) return null;
  const sum = k => cs[0][k] ? cs[0][k].map((_,i) => cs.reduce((s,c) => s + c[k][i], 0)) : null;
  return {y:sum('y'), tab:sum('tab'), act:sum('act'), lgb:sum('lgb'), sh:sum('sh'), teater:cs.reduce((s,c)=>s+c.teater,0), city:kota, id:cs[0].id};
}
const entry = (p, kota, kl) => kl==='__all' ? agg(p, kota) : p.cities[kl];
const byNum = (a,b) => a.localeCompare(b,'id',{numeric:true});
function fillCity(p, city){
  const c = p && entry(p, $('kota').value, city); if(!c) return;
  $('teater').value=c.teater; ['y1','y2','y3'].forEach((id,i)=>$(id).value=c.y[i]);
}
function kotaList(list, keep){
  $('kota').innerHTML = list.map(c=>`<option>${c}</option>`).join('');
  $('kota').value = list.includes(keep) ? keep : list[0];
}
function klList(p, kota, keep){
  const kls = Object.keys(p.cities).filter(k => p.cities[k].city===kota).sort(byNum);
  $('city').innerHTML = kls.map(k=>`<option value="${k}">${k.split(' ').pop()} · ${p.cities[k].id}</option>`).join('');
  $('city').value = kls.includes(keep) ? keep : kls[0];
  $('kllab').textContent = `ID klaster (${kls.length} klaster)`;
}
// Listed films show their cinema cluster (theaters stay in the data, used for "penuh"); a new film has no cluster, so it asks for theaters.
function lockTeater(on){ $('tbox').hidden = on; $('klbox').hidden = !on; }
function load(p){
  $('film').value=p.film; $('filmNew').hidden=true; $('filmNew').required=false; lockTeater(true);
  const kota = p.cities[p.def].city;
  kotaList([...new Set(Object.values(p.cities).map(c=>c.city))].sort(byNum), kota); klList(p, kota, p.def);
  $('d1').value=p.d1; fillCity(p, p.def);
}
function openFilm(name, kl, kota){
  const p = DATA.demo.find(d=>d.film===name); load(p);
  if(kota){ $('kota').value = kota; klList(p, kota, kl); fillCity(p, $('city').value); }
  run(); show('sim');
}

function show(view){
  ['sim','man'].forEach(k => { $('v-'+k).hidden = k!==view; $('t-'+k).setAttribute('aria-selected', String(k===view)); });
}
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => show(b.dataset.v)));

// Group films by what their forecast week (D4–D10) contains; Lebaran and Natal are date-shifted scenarios (no actual sales).
function weekOf(p){
  const days = [3,4,5,6,7,8,9].map(i => addDays(p.d1, i)), hol = days.map(holShort).find(Boolean);
  return hol ? ['Libur nasional', hol] : days.some(d => weight(d)===0.91) ? ['Libur sekolah', ''] : ['Hari biasa', ''];
}
const SCEN = {};
[['Lebaran 2026','2026-03-18',['Jurassic World','Lilo & Stitch','The Conjuring','Pembantaian Dukun Santet']],
 ['Natal 2025','2025-12-24',['Lilo & Stitch','Fantastic Four','Jurassic World','Superman']]].forEach(([lab,d1,films]) =>
  films.filter(f=>DATA.demo.some(p=>p.film===f)).forEach(f => { SCEN[`__s${Object.keys(SCEN).length}`] = {film:f, d1, lab}; }));
const groups = {};
DATA.demo.filter(p=>!p.uji).forEach(p => { const [g, h] = weekOf(p); (groups[g] = groups[g] || []).push(`<option value="${p.film}">${p.film}${h?` · ${h}`:''}</option>`); });
const ujiOpts = DATA.demo.filter(p=>p.uji).map(p=>`<option value="${p.film}">${p.film}</option>`).join('');
const scenOpts = lab => Object.entries(SCEN).filter(([,s])=>s.lab===lab).map(([k,s])=>`<option value="${k}">${s.film} · ${s.lab.split(" ")[0]}</option>`).join('');
$('film').innerHTML = ['Hari biasa','Libur nasional','Libur sekolah'].filter(g=>groups[g]).map(g=>`<optgroup label="Data latih · ${g}">${groups[g].join('')}</optgroup>`).join('')
  + (ujiOpts ? `<optgroup label="Data uji · Natal 2025, Yogyakarta (tanpa aktual)">${ujiOpts}</optgroup>` : '')
  + `<optgroup label="Simulasi tanggal · Lebaran 2026">${scenOpts('Lebaran 2026')}</optgroup><optgroup label="Simulasi tanggal · Natal 2025">${scenOpts('Natal 2025')}</optgroup>`
  + '<option value="__new">+ Film baru (isi manual)</option>';
$('film').addEventListener('change',()=>{
  const fv = $('film').value, sc = SCEN[fv], p = DATA.demo.find(d=>d.film===(sc ? sc.film : fv));
  if(p){ load(p); if(sc){ $('film').value = fv; $('d1').value = sc.d1; } run(); return; }
  $('filmNew').hidden=false; $('filmNew').required=true; $('filmNew').value=''; kotaList(DATA.cities); lockTeater(false);
  ['teater','y1','y2','y3'].forEach(id=>$(id).value=''); labels(read()); $('filmNew').focus();
});
// Listed films update as soon as city, date or tickets change; a new film waits for the button, except re-sizing theaters.
$('f').addEventListener('input', e=>{
  if(e.target.id==='film') return;
  labels(read());
  if(read().isNew && !(e.target.id==='teater' && lastFilm===read().film)) return;
  const P = DATA.demo.find(d=>d.film===read().film);
  if(e.target.id==='kota') klList(P, $('kota').value, '');
  if(e.target.id==='kota' || e.target.id==='city') fillCity(P, $('city').value);
  clearTimeout(timer); timer = setTimeout(run, 250);
});
$('f').addEventListener('submit',e=>{e.preventDefault(); run();});


// Manajer: pick a city, then one of its cinema clusters; films are grouped by decision and the counters filter the groups
const pillStyle = k => `color:${k};border-color:color-mix(in srgb, ${k} 40%, transparent);background:color-mix(in srgb, ${k} 12%, transparent)`;
const KLS = {};  // cluster label -> {city, id, n films}
DATA.demo.filter(p=>!p.uji).forEach(p => Object.entries(p.cities).forEach(([kl, c]) => { (KLS[kl] = KLS[kl] || {city:c.city, id:c.id, n:0}).n++; }));
const mcities = [...new Set(Object.values(KLS).map(k=>k.city))].sort(byNum);
const filmsIn = city => Object.values(KLS).filter(k=>k.city===city).reduce((s,k)=>s+k.n,0);
$('mcity').innerHTML = mcities.map(c=>`<option>${c}</option>`).join('');
$('mcity').value = mcities.reduce((a,b)=>filmsIn(b)>filmsIn(a)?b:a);
let mOnly = null;
function mklList(){
  const kls = Object.keys(KLS).filter(k=>KLS[k].city===$('mcity').value).sort((a,b)=>KLS[b].n-KLS[a].n || byNum(a,b));
  $('mkl').innerHTML = kls.map(k=>`<option value="${k}">Klaster ${k.split(' ').pop()} · ${KLS[k].id} (${KLS[k].n} film)</option>`).join('');
}
function manager(){
  const kl = $('mkl').value, kota = $('mcity').value, groups = Object.fromEntries(ORDER.map(c=>[c,[]]));
  DATA.demo.filter(p=>!p.uji && entry(p, kota, kl)).sort((a,b)=>b.d1.localeCompare(a.d1)).forEach(p => {
    const c = entry(p, kota, kl), avg = (c.y[0]+c.y[1]+c.y[2])/3, v = decideCap(c.tab, c.y, capOf(c)), k = col(v.code), mx = Math.max(...c.tab, 1);
    const spark = c.tab.map((t,i)=>`<i style="height:${Math.max(2, t/mx*26)}px;${v.days.includes(i)?`background:${k}`:''}"></i>`).join('');
    groups[v.code].push(`<tr data-film="${p.film}"><td><b>${p.film}</b></td><td>${fmtD(p.d1)}</td><td>${fmtN(avg)}</td>`
      + `<td><span class="spark">${spark}</span></td><td>${fmtN(c.tab.reduce((a,b)=>a+b,0))}</td>`
      + `<td><span class="pill" style="${pillStyle(k)}">${WORD[v.code]}</span></td></tr>`);
  });
  // all four categories always shown, empty ones say so
  $('mrows').innerHTML = ORDER.filter(c=>!mOnly || mOnly===c)
    .map(c=>`<tr class="grp"><td colspan="6" style="color:${col(c)}">${WORD[c]} · ${groups[c].length} film</td></tr>` + (groups[c].length ? groups[c].join('') : '<tr class="none"><td colspan="6">Tidak ada film</td></tr>')).join('');
  $('mcount').innerHTML = ORDER.map(c=>`<button type="button" data-c="${c}" aria-pressed="${!mOnly || mOnly===c}" style="${pillStyle(col(c))}">${groups[c].length} ${WORD[c]}</button>`).join('');
  document.querySelectorAll('#mcount button').forEach(b => b.addEventListener('click', () => { mOnly = mOnly===b.dataset.c ? null : b.dataset.c; manager(); }));
  document.querySelectorAll('#mrows tr[data-film]').forEach(r => r.addEventListener('click', () => openFilm(r.dataset.film, kl, kota)));
}
$('mcity').addEventListener('change', () => { mOnly = null; mklList(); manager(); });
$('mkl').addEventListener('change', () => { mOnly = null; manager(); });
mklList(); manager();


load(DATA.demo.find(d=>d.film==='Pengepungan di Bukit Duri')); run();
