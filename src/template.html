<title>TUKANGDATA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
/* Layout: dark cinema console. Header with tabs; Simulasi = input panel (4/12) + decision banner, 10-day chart, rule strip (8/12). */
:root{
  --bg:#0B0C10; --panel:#13151C; --card:#1A1D27; --border:#272B38; --fg:#F3F4F6; --muted:#9CA3AF; --dim:#6B7280;
  --red:#E50914; --gold:#D4AF37; --goldl:#F3D067; --known:#475569; --fc:#6366F1;
  --tambah:#34D399; --pertahankan:#38BDF8; --kurangi:#F59E0B; --turunkan:#EF4444;
  --sans:"Plus Jakarta Sans",ui-sans-serif,system-ui,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{min-height:100vh;background-color:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45;
  background-image:radial-gradient(circle at 10% 0%,rgba(212,175,55,.07),transparent 40%),radial-gradient(circle at 90% 0%,rgba(229,9,20,.07),transparent 40%)}
.mono{font-family:var(--mono)}
.top{border-bottom:1px solid var(--border);background:rgba(11,12,16,.92)}
.top::before{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--red),var(--gold))}
.in,.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{min-height:62px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand i{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--red),#7F1D1D);font-style:normal;font-size:12px;color:#fff}
.brand b{color:var(--red)}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:4px}
.tabs button{font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:none;border:1px solid transparent;border-radius:8px;padding:6px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--goldl);border-color:rgba(212,175,55,.4)}
.engine{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:6px 12px}
.engine::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tambah)}
.engine b{color:var(--fg)} .engine em{font-style:normal;color:var(--goldl)}
.wrap{padding-block:20px 36px}
.sim{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:20px;align-items:stretch}
.sim>aside{display:flex;flex-direction:column}
@media (max-width:1000px){.sim{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
form{display:flex;flex-direction:column;justify-content:space-between;gap:14px;flex:1}
.f{display:grid;gap:6px;min-width:0}
label,.cap{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input,select{font:inherit;font-size:14px;color:var(--fg);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;width:100%;min-width:0}
optgroup{background:#2B303D;color:#D1D5DB;font-weight:700;font-style:normal}
option{background:var(--card);color:var(--fg);font-weight:500}
input[readonly]{color:var(--dim);cursor:default}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.two{display:flex;gap:10px;align-items:flex-end}.two>.f{flex:1 1 0}.two>#tbox{flex:0 0 38%}
.box{background:rgba(26,29,39,.7);border:1px solid var(--border);border-radius:12px;padding:12px;display:grid;gap:8px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.three span{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;margin-bottom:4px}
.three input{background:var(--bg);text-align:center;font-family:var(--mono);font-weight:700;font-size:15px}
.reads{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11px;color:var(--muted)}
.reads div{background:rgba(11,12,16,.6);border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;gap:6px}
.reads b{font-family:var(--mono);color:var(--goldl)}
.go{font:inherit;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#fff;border:0;border-radius:12px;padding:13px;cursor:pointer;background:linear-gradient(90deg,var(--red),#B91C1C);box-shadow:0 8px 20px -8px rgba(229,9,20,.5)}
.err{font-size:12px;color:var(--turunkan)}
.err:empty{display:none}
.stage{display:grid;gap:20px;min-width:0}
.banner{border-width:1px;border-style:solid;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.badge{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;border-radius:6px;padding:3px 10px;border:1px solid}
.desc{margin:6px 0 0;max-width:46ch;font-size:13px;color:var(--muted)}
.word{margin:0;text-transform:uppercase;font-size:clamp(26px,3.2vw,34px);font-weight:800;letter-spacing:-.01em;line-height:1.05}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;min-width:120px;display:grid;gap:2px}
.kpi span{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.kpi b{font-family:var(--mono);font-size:20px;font-weight:800}
.kpi small{font-size:10.5px;color:var(--muted)}
.chead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--border)}
.chead h3{margin:0;font-size:17px;font-weight:700}
.chead h3 small{font-size:12px;font-weight:500;color:var(--muted)}
.chart{overflow-x:auto}
.cin{min-width:640px}
.zones{display:grid;grid-template-columns:3fr 7fr;gap:10px;margin-bottom:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.zones div{border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;gap:6px}
.zones .k{background:var(--card);border:1px solid var(--border);color:var(--muted)} .zones .k b{color:var(--goldl)}
.zones .p{background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.3);color:#C7D2FE}
.days{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px;align-items:start}
.day{display:grid;justify-items:center;gap:6px;min-width:0}
.day.first{border-left:2px dashed rgba(99,102,241,.4);padding-left:8px}
.num{text-align:center;line-height:1.15}
.num b{display:block;font-family:var(--mono);font-size:14px;font-weight:800}
.num span{font-family:var(--mono);font-size:10px;color:#C7D2FE}
.day.known .num span{color:var(--muted)}
.track{position:relative;width:100%;height:190px;background:rgba(11,12,16,.8);border:1px solid rgba(39,43,56,.7);border-radius:10px;padding:3px;display:flex;align-items:flex-end;overflow:hidden}
.day.we .track{background:rgba(212,175,55,.06)}
.bar{width:100%;border-radius:7px;min-height:3px;background:linear-gradient(0deg,#312E81,var(--fc));border-top:1px solid rgba(165,180,252,.6)}
.day.known .bar{background:linear-gradient(0deg,#1E293B,var(--known));border-top:2px solid var(--gold)}
.day.zero .bar{background:rgba(127,29,29,.5);border:1px solid var(--red)}
@media (prefers-reduced-motion:no-preference){.bar{animation:grow .5s cubic-bezier(.16,1,.3,1);transform-origin:bottom}@keyframes grow{from{transform:scaleY(.05)}}}
.ghost{position:absolute;bottom:3px;left:3px;right:3px;border:2px dashed var(--tambah);border-bottom:0;border-radius:7px 7px 0 0}
.capl{position:absolute;left:0;right:0;border-top:2px dashed rgba(243,208,103,.75);z-index:1}
.track.stop{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.5)}
.act{position:absolute;left:50%;width:12px;height:12px;margin:0 0 -6px -6px;border-radius:50%;background:#fff;border:2px solid var(--bg);box-shadow:0 0 0 2px var(--gold)}
.lab{display:grid;justify-items:center;gap:2px;width:100%;min-width:0;text-align:center}
.lab b{font-family:var(--mono);font-size:10px;color:var(--muted)}
.day.we .lab b{color:var(--goldl)}
.lab span{font-size:11px;color:#D1D5DB}
.hol{min-height:22px;display:flex;align-items:flex-start;justify-content:center;width:100%}
.hol em{font-style:normal;font-size:9.5px;font-weight:600;line-height:1.2;color:var(--goldl);background:rgba(212,175,55,.15);border:1px solid rgba(212,175,55,.4);border-radius:4px;padding:2px 4px;max-width:100%}
.hol em.full{color:var(--tambah);background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.4)}
.occ{font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:4px;padding:1px 5px}
.occ.full{color:var(--tambah);border-color:rgba(52,211,153,.4)}
.legend{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.legend>span{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--gold);margin-right:5px;vertical-align:-1px}
.dash{display:inline-block;width:16px;border-top:2px dashed var(--goldl);margin-right:5px;vertical-align:3px}
.rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.rules{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.rule{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;opacity:.55}
.rule.on{opacity:1;border:2px solid var(--gold);background:rgba(212,175,55,.12)}
.rule p{margin:0}.rule .n{font-family:var(--mono);font-size:10px;font-weight:700}
.rule .t{font-weight:700;margin-top:2px}.rule .c{font-size:11px;color:var(--muted);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
th{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center;padding:12px 10px;border-bottom:1px solid var(--border);background:rgba(26,29,39,.6)}
td{padding:14px 10px;border-bottom:1px solid var(--border);text-align:center;font-family:var(--mono)}
th:first-child,td:first-child{text-align:left;font-family:var(--sans)} th:last-child,td:last-child{text-align:right}
td small{display:block;font-size:10px;color:var(--muted)}
tbody tr{cursor:pointer} tbody tr:hover{background:rgba(26,29,39,.8)}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:11.5px;font-weight:700;border:1px solid;border-radius:8px;padding:4px 10px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tbl{overflow-x:auto}
.mhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.msel{display:flex;flex-wrap:wrap;gap:10px}.mhead select{width:auto;min-width:180px;font-weight:700}
.counts{display:flex;flex-wrap:wrap;gap:8px}
.counts button{font:inherit;font-size:12px;font-weight:700;border:1px solid;border-radius:8px;padding:5px 10px;cursor:pointer;opacity:.55}
.counts button[aria-pressed="true"]{opacity:1}
tr.none td{text-align:left!important;font-family:var(--sans);font-size:12px;color:var(--dim);cursor:default}
tr.grp td{font-family:var(--sans);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(26,29,39,.6);padding:8px 10px;cursor:default;text-align:left!important}
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:26px}
.spark i{display:block;width:7px;border-radius:2px 2px 0 0;background:var(--fc)}
.sec-title{margin:6px 0 2px;font-size:20px;font-weight:800}
</style>

<header class="top"><div class="in">
  <div class="brand"><i>TD</i><span>TUKANG<b>DATA</b></span></div>
  <nav class="tabs" role="tablist">
    <button role="tab" id="t-sim" aria-selected="true" data-v="sim">Simulasi</button>
    <button role="tab" id="t-man" aria-selected="false" data-v="man">Manajer</button>
  </nav>
</div></header>

<main class="wrap">
  <section id="v-sim" class="sim">
    <aside class="panel">
      <form id="f" autocomplete="off">
        <div class="f"><label for="film">Film</label><select id="film"></select><input id="filmNew" placeholder="Ketik judul film baru" hidden></div>
        <div class="two">
          <div class="f"><label for="kota">Kota</label><select id="kota"></select></div>
          <div class="f" id="klbox"><label for="city" id="kllab">ID klaster</label><select id="city"></select></div>
          <div class="f" id="tbox" hidden><label for="teater">Teater</label><input id="teater" type="number" min="1" max="30" step="1" placeholder="2" required></div>
        </div>
        <div class="f"><label for="d1">Tanggal hari pertama</label><input id="d1" type="date" min="2025-03-01" max="2026-04-21" required></div>
        <div class="box">
          <span class="cap">Tiket terjual D1–D3</span>
          <div class="three">
            <div><span id="l1">D1</span><input id="y1" type="number" min="0" max="100000" step="1" aria-label="Tiket hari 1" required></div>
            <div><span id="l2">D2</span><input id="y2" type="number" min="0" max="100000" step="1" aria-label="Tiket hari 2" required></div>
            <div><span id="l3">D3</span><input id="y3" type="number" min="0" max="100000" step="1" aria-label="Tiket hari 3" required></div>
          </div>
        </div>
        <button class="go" type="submit">Prediksi</button>
        <div class="err" id="err" role="alert"></div>
      </form>
    </aside>

    <div class="stage">
      <div class="panel banner" id="banner" aria-live="polite">
        <div><h1 class="word" id="word"></h1><p class="desc" id="desc"></p></div>
        <div class="kpis">
          <div class="kpi"><span>Prediksi total penjualan 7 hari</span><b id="k2"></b></div>
          <div class="kpi" id="k3box"><span>MASE</span><b id="k3" style="color:var(--tambah)"></b><small id="k3s"></small></div>
        </div>
      </div>

      <div class="panel">
        <div class="chead"><h3 id="ctitle"></h3></div>
        <div class="chart"><div class="cin">
          <div class="days" id="days"></div>
        </div></div>
        <div class="legend"><span id="legend"></span></div>
      </div>


    </div>
  </section>


  <section id="v-man" hidden>
    <div class="panel" style="display:grid;gap:16px">
      <div class="mhead"><div class="msel"><select id="mcity" aria-label="Kota"></select><select id="mkl" aria-label="Klaster"></select></div><div class="counts" id="mcount"></div></div>
      <div class="tbl"><table><thead><tr><th>Film</th><th>Rilis</th><th>Rata-rata D1–D3</th><th>Prediksi 7 hari</th><th>Total 7 hari</th><th>Keputusan</th></tr></thead><tbody id="mrows"></tbody></table></div>
    </div>
  </section>

</main>

<script>
const DATA = __DATA__;
/*ENGINE*/__ENGINE__/*END*/
__UI__
</script>
